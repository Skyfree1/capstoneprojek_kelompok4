{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width:420px"><div class="card-body">
  <h4>{{ 'Daftar' if mode == 'register' else 'Masuk' }}</h4>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if mode == 'register' %}
      <input class="form-control mb-2" name="name" placeholder="Nama lengkap" required>
      <select class="form-select mb-2" name="rt" required>
        {% for r in rts %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
      </select>
    {% endif %}
    <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
    <input class="form-control mb-3" type="password" name="password" placeholder="Kata sandi"
           {% if mode == 'register' %}minlength="6"{% endif %} required>
    <button class="btn btn-primary w-100">{{ 'Daftar' if mode == 'register' else 'Masuk' }}</button>
  </form>
  <p class="mt-3 mb-0 small">
    {% if mode == 'register' %}Sudah punya akun? <a href="{{ url_for('login') }}">Masuk</a>
    {% else %}Belum punya akun? <a href="{{ url_for('register') }}">Daftar</a>{% endif %}
  </p>
</div></div>
{% endblock %}
